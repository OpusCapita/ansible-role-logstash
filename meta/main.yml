---
galaxy_info:
  role_name: logstash
  author: geerlingguy
  description: Logstash for Linux.
  company: "Midwestern Mac, LLC"
  license: "license (BSD, MIT)"
  min_ansible_version: 2.4
  platforms:
    - name: EL
      versions:
        - 6
        - 7
        - 8
    - name: Debian
      versions:
        - all
    - name: Ubuntu
      versions:
        - all
  galaxy_tags:
    - web
    - system
    - monitoring
    - logging
    - logs
    - elk
    - logstash
dependencies:
  - role: apt_package_pinning
    apt_pinned_packages:
      - package: '{{ logstash_apt_package_name }}'
        version: '{{ logstash_apt_package_version }}'
        priority: 1001
    apt_package_pinning_file_name: "logstash_pin.pref"
    when:
      - ansible_facts['pkg_mgr'] == 'apt'
      - logstash_apt_package_version | length > 0
