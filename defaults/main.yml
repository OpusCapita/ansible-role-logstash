---
logstash_version_repo: '7.x'
logstash_apt_package_version: ""
logstash_apt_package_name: logstash
logstash_apt_package: '{% if logstash_apt_package_version | length > 0 %}{{ logstash_apt_package_name }}={{ logstash_apt_package_version }}{% else %}{{ logstash_apt_package_name }}{% endif %}'

logstash_listen_port_beats: 5044

logstash_elasticsearch_hosts:
  - http://localhost:9200

logstash_dir: /usr/share/logstash

logstash_ssl_dir: /etc/pki/logstash
logstash_ssl_certificate_file: ""
logstash_ssl_key_file: ""

logstash_enabled_on_boot: true

logstash_install_plugins:
  - logstash-input-beats
  - logstash-filter-multiline

logstash_log4j2_properties:
  "logger.fileoutput.name": "logstash.outputs.file"
  "logger.fileoutput.level": "warn"

logstash_nice: 19
logstash_mem: '1g'